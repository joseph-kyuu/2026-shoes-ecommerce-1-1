<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nelson的部落格</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- GoogleFont -->
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
    />
    <!-- BS5 CDN -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./css/main.css" />
  </head>
  <body>
    <!-- header -->
    <!-- 選單、會員按鈕、hero -->
    <header>
      <!-- 選單、會員按鈕 -->
      <!-- 桌面版 -->
      <nav class="container d-flex justify-content-between py-md3 p-7">
        <!-- 選單 -->
        <ul class="list-unstyled d-flex align-items-center">
          <li class="me-5">
            <a href="index.html">
              <h1>
                <img
                  src="./img/svg/logo/logo.svg"
                  alt="品牌標誌"
                  title="品牌標誌"
                />
              </h1>
            </a>
          </li>
          <li class="me-6 d-flex align-items-center main-nav d-none d-sm-flex">
            <a class="py-7 fw-medium me-6" href="＃">品牌故事</a>
            <a class="py-7 fw-medium me-6" href="#">商品列表</a>
          </li>
        </ul>
        <!-- 會員按鈕 -->
        <a class="p-7" href="#">
          <img
            src="./img/svg/icon/person.svg"
            alt="會員標誌"
            title="會員標誌"
          />
        </a>
      </nav>
      <!-- 手機版 -->
      <nav>
        <ul class="list-unstyled d-flex d-sm-none text-center">
          <li class="w-100">
            <a
              class="py-7 fw-medium w-100 bg-primary-100 nav-phone active"
              href="＃"
              >品牌故事</a
            >
          </li>
          <li class="w-100">
            <a class="py-7 fw-medium bg-primary-100 w-100 nav-phone" href="#"
              >商品列表</a
            >
          </li>
        </ul>
      </nav>
    </header>
    <!-- main -->
    <main class="py-sm-9">
      <section class="container px-sm-7 px-0">
        <div class="d-flex flex-sm-row flex-column">
          <!-- 品牌廣告  -->
          <!-- 標題  -->
          <div class="me-sm-4 max-w-3">
            <img
              class="d-md-block d-none"
              src="./img/login.png"
              alt="品牌形象圖"
            />
            <img
              class="d-sm-none flex-grow-1"
              src="./img/login-sm.png"
              alt="品牌形象圖"
            />
          </div>
          <!-- 登入、註冊 -->
          <div
            class="px-xl-19 py-sm-20 py-10 px-sm-7 bg-neutral-200 radius-sm-1 flex-grow-1"
          >
            <form class="px-sm-0 px-7" action="">
              <!-- 標題 -->
              <div class="mb-sm-10 mb-4">
                <h2 class="fs-3 text-neutral-900 fw-bold lh-1p2 text-center">
                  歡迎 !
                </h2>
              </div>
              <!-- 切換 -->
              <ul class="list-unstyled d-flex mb-sm-10 mb-4">
                <li class="flex-grow-1 text-center">
                  <a
                    class="py-7 text-neutral-600 fw-bold lh-1p2 auth auth-active"
                    href="#"
                  >
                    登入
                  </a>
                </li>
                <li class="flex-grow-1 text-center">
                  <a class="py-7 text-neutral-600 fw-bold lh-1p2 auth" href="#">
                    註冊
                  </a>
                </li>
              </ul>
              <!-- 輸入欄位 -->
              <ul class="list-unstyled login-input">
                <li class="d-flex bg-neutral-0 p-7 rounded-2 mb-2">
                  <span class="me-7">
                    <img src="./img/svg/social/facebook.svg" alt="Facebook" />
                  </span>
                  <input
                    type="text"
                    class="border-0 p-0"
                    placeholder="Facebook 登入"
                  />
                </li>
                <li class="d-flex bg-neutral-0 p-7 rounded-2 mb-2">
                  <span class="me-7">
                    <img src="./img/svg/social/apple.svg" alt="Apple" />
                  </span>
                  <input
                    type="text"
                    class="border-0 p-0"
                    placeholder="Apple 登入"
                  />
                </li>
                <li class="d-flex bg-neutral-0 p-7 rounded-2 mb-2">
                  <span class="me-7">
                    <img src="./img/svg/social/google.svg" alt="Google" />
                  </span>
                  <input
                    type="text"
                    class="border-0 p-0"
                    placeholder="Google 登入"
                  />
                </li>
              </ul>
            </form>
          </div>
        </div>
      </section>
    </main>
    <!-- footer -->
    <!-- 優惠資訊、CTA、主選單、所有權 -->
    <footer>
      <!-- 主選單、所有權 -->
      <section class="py-sm-9 py-10 px-7">
        <!-- 主選單 -->
        <nav class="mb-4">
          <ul
            class="list-unstyled d-flex justify-content-between align-items-sm-center flex-sm-row flex-column"
          >
            <li class="mb-sm-0 mb-2">
              <a href="index.html">
                <img
                  src="./img/svg/logo/logo.svg"
                  alt="品牌標誌"
                  title="品牌標誌"
                />
              </a>
            </li>
            <li>
              <ul
                class="list-unstyled footer-nav d-flex flex-sm-row flex-column ms-7 ms-sm-0"
              >
                <li class="me-sm-6 me-0 py-7">
                  <a class="text-neutral-900 fw-medium" href="#">商品列表</a>
                </li>
                <li class="me-sm-6 me-0 py-7">
                  <a class="text-neutral-900 fw-medium" href="#">品牌故事</a>
                </li>
              </ul>
            </li>
          </ul>
        </nav>
        <!-- 所有權 -->
        <div class="pt-10 text-center border-top border-neutral-300">
          <div class="mb-1">
            <p class="text-neutral-600 fs-7 fw-normal">
              Copyright ©2025 URBNSTYLE
            </p>
          </div>
          <p class="text-neutral-600 fs-7 fw-normal">All Rights Reserved.</p>
        </div>
      </section>
    </footer>
  </body>
</html>
